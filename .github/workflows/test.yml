name: Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Format
      run: cargo fmt --all --check

  lint:
    runs-on: ubuntu-latest
    needs: format
    steps:
      - uses: actions/checkout@v3
      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo
            target
          key: ${{ runner.os }}-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-build-
      - name: Install Clippy
        run: rustup component add clippy
      - name: Run Clippy
        run: cargo clippy -- -D warnings

  build:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        toolchain: [stable, beta, nightly]
    steps:
      - uses: actions/checkout@v3
      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo
            target
          key: ${{ runner.os }}-${{ matrix.toolchain }}-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.toolchain }}-build-
            ${{ runner.os }}-build-
      - name: Set up Rust toolchain
        run: rustup toolchain install ${{ matrix.toolchain }}
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - name: Build
        run: cargo +${{ matrix.toolchain }} build --verbose

  test:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write # Required to authenticate the coverage upload via OIDC
    strategy:
      matrix:
        toolchain: [stable, beta, nightly]
    steps:
      - uses: actions/checkout@v3
      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo
            target
          key: ${{ runner.os }}-${{ matrix.toolchain }}-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.toolchain }}-build-
            ${{ runner.os }}-build-
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - name: Set up Rust toolchain
        run: rustup toolchain install ${{ matrix.toolchain }}
      - name: Run tests
        if: matrix.toolchain != 'stable'
        run: cargo +${{ matrix.toolchain }} test --verbose
      - name: Install cargo-llvm-cov
        if: matrix.toolchain == 'stable'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Install llvm-tools-preview
        if: matrix.toolchain == 'stable'
        run: rustup component add llvm-tools-preview --toolchain ${{ matrix.toolchain }}
      - name: Run tests with coverage
        if: matrix.toolchain == 'stable'
        run: cargo +${{ matrix.toolchain }} llvm-cov --verbose --lcov --output-path lcov.info
      - name: Upload coverage to Qlty
        if: ${{ matrix.toolchain == 'stable' && !github.event.pull_request.head.repo.fork }}
        uses: qltysh/qlty-action/coverage@v2
        with:
          oidc: true
          files: lcov.info
          strip-prefix: ${{ github.workspace }}/
